[workspace]
resolver = "2"
members = [
    ".",
    "open_oura/crates/oura-protocol",
    "open_oura/crates/oura-link",
    "open_oura/crates/oura-analysis",
    "open_oura/crates/oura-store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Th0rgal/omarchnix"

[package]
name = "oura-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cloud-free Oura Ring BLE daemon, daily trend analyzer, and Hyprland gesture navigator for Omarchnix"

[[bin]]
name = "ourad"
path = "src/bin/ourad.rs"

[[bin]]
name = "ouractl"
path = "src/bin/ouractl.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
oura-analysis = { path = "open_oura/crates/oura-analysis" }
oura-link = { path = "open_oura/crates/oura-link" }
oura-protocol = { path = "open_oura/crates/oura-protocol" }
oura-store = { path = "open_oura/crates/oura-store" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
